name: Deploy to GitHub Pages

# Replaces the built-in "Deploy from a branch" Pages workflow, which had no
# retry or concurrency control. The hourly `chore: update predictions` pushes
# from the valorant_match_prediction repo occasionally hit a transient
# "Deployment failed, try again later." from the Pages backend; this adds a
# single automatic retry plus serialized deploys so those blips stop paging us.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys: if an hourly push lands while a prior deploy is still
# running, queue it instead of racing (racing is a common cause of the
# "try again later" error). Don't cancel in-progress — let it finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # If the Pages backend returned a transient failure above, try once more
      # instead of waiting for the next hourly push (and paging us in between).
      - name: Retry deploy on transient failure
        if: failure() && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
